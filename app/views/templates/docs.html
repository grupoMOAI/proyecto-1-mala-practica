<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Documentación - Extractor de PDF</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            line-height: 1.6;
        }
        h1, h2 {
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background: #f4f4f4;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
        }
        pre code {
            display: block;
            padding: 12px;
        }
        .error {
            color: #b00020;
        }
        .volver {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <a class="volver" href="{{ url_for('pdf.index') }}">&larr; Volver a la aplicación</a>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% else %}
        {{ content_html | safe }}
    {% endif %}
</body>
</html>
