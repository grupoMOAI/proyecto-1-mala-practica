<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Extractor de PDF</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
            background: #2e7d32;
        }
        h1 {
            font-size: 1.5rem;
        }
        pre {
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error {
            color: #b00020;
        }
        form.upload {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 24px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .export-form {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Extractor de PDF</h1>

    <p><a href="{{ url_for('docs.index') }}">Ver documentación / manual de usuario</a></p>

    <form class="upload" action="{{ url_for('pdf.cargar_pdf') }}" method="post" enctype="multipart/form-data">
        <input type="file" name="pdf_file" accept="application/pdf" required>
        <button type="submit">Cargar PDF</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if text %}
        <pre>{{ text }}</pre>
        <form class="export-form" action="{{ url_for('pdf.exportar_txt') }}" method="get">
            <button type="submit">Exportar a TXT</button>
        </form>
    {% endif %}
</body>
</html>
